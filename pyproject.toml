[project]
name = "case-assistant"
version = "0.1.0"
description = "Assistente de IA que consulta processos judiciais sintéticos (desafio.sqlite) e cita as fontes."
authors = [
    { name = "Andre Piacentini", email = "eu@andrepiacentini.com.br" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "chainlit>=2.12.0",
    "plotly>=7.1.0",
    "pydantic-ai-slim[anthropic,google,openai]>=2.50.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
case-assistant = "case_assistant.cli:main"
case-assistant-eval = "case_assistant.evaluation:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# app.py (interface web) fica na raiz, fora do pacote: os testes da tela de boas-vindas o importam (T10.4).
pythonpath = ["."]
